<title>{{title}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap">
<style>
/* Layout: a reading column beside a sticky page menu; on phones the menu folds above the page. */
:root {
  --bg: #f6f7fb; --panel: #ffffff; --ink: #121a2e; --muted: #536079; --line: #d8deec;
  --accent: #2a52be; --accent-soft: #e7edfb; --new: #1f7a4d; --new-soft: #e2f4ea; --changed: #8a5a00; --changed-soft: #fbf0d9;
  --note-bg: #eef2fc;
  --display: Montserrat, "Segoe UI", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1220; --panel: #121b2e; --ink: #e8ecf6; --muted: #9aa6c0; --line: #26324c;
  --accent: #8fa8f0; --accent-soft: #1c2a4d; --new: #7fd4a6; --new-soft: #12301f; --changed: #f0c36a; --changed-soft: #3a2c0c;
  --note-bg: #16223e; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0b1220; --panel: #121b2e; --ink: #e8ecf6; --muted: #9aa6c0; --line: #26324c;
  --accent: #8fa8f0; --accent-soft: #1c2a4d; --new: #7fd4a6; --new-soft: #12301f; --changed: #f0c36a; --changed-soft: #3a2c0c;
  --note-bg: #16223e; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font: 16px/1.65 var(--body); }
.shell { display: grid; grid-template-columns: 17rem minmax(0, 1fr); gap: 2.5rem; max-width: 76rem; margin: 0 auto;
  padding-block: 1.5rem 4rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .5rem 1.5rem;
  border-bottom: 1px solid var(--line); padding-bottom: 1rem; }
header.top h2 { font: 700 1.35rem/1.2 var(--display); margin: 0; text-wrap: balance; }
header.top p { margin: 0; color: var(--muted); font-size: .9rem; }
.badge-draft { font: 600 .7rem/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: .35rem .55rem; border-radius: 4px; margin-right: .5rem; }
nav.menu { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 1rem); align-self: start; max-height: calc(100vh - 2rem); overflow: auto; font-size: .92rem; }
nav.menu summary { display: none; }
.nav-item + .nav-item { margin-top: 1.25rem; }
.nav-product { font: 700 .95rem var(--display); margin: 0 0 .25rem; }
.nav-section { font: 600 .68rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: .9rem 0 .2rem; }
nav.menu ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
nav.menu a { display: block; padding: .3rem .55rem; border-radius: 6px; color: var(--ink); text-decoration: none; }
nav.menu a:hover { background: var(--accent-soft); }
nav.menu a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.mark { font: 600 .62rem/1 var(--display); letter-spacing: .06em; text-transform: uppercase; padding: .2rem .35rem; border-radius: 3px; vertical-align: .12em; }
.mark-new { color: var(--new); background: var(--new-soft); }
.mark-changed { color: var(--changed); background: var(--changed-soft); }
main { min-width: 0; }
.page { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: clamp(1.25rem, 4vw, 2.75rem); }
.page > * { max-width: 44rem; }
.crumb { margin: 0; color: var(--muted); font-size: .85rem; }
.page h1 { font: 700 clamp(1.7rem, 4vw, 2.3rem)/1.15 var(--display); margin: .35rem 0 .5rem; text-wrap: balance; }
.tagline { font: 500 1.15rem var(--display); color: var(--accent); margin: 0 0 .5rem; }
.summary { color: var(--muted); margin: 0 0 1.5rem; border-bottom: 1px solid var(--line); padding-bottom: 1.25rem; }
.content h2 { font: 700 1.35rem/1.25 var(--display); margin: 2rem 0 .5rem; text-wrap: balance; }
.content h3 { font: 600 1.1rem var(--display); margin: 1.5rem 0 .4rem; }
.content a { color: var(--accent); }
.content code { font: .88em var(--mono); background: var(--accent-soft); padding: .1em .35em; border-radius: 4px; }
.content pre { overflow-x: auto; background: var(--accent-soft); padding: 1rem; border-radius: 8px; }
.content pre code { background: none; padding: 0; }
.content img { display: block; max-width: 100%; height: auto; margin: 1.25rem 0; border-radius: 10px; }
.content .table-wrap, .content table { display: block; overflow-x: auto; }
.content table { border-collapse: collapse; width: 100%; font-size: .94rem; margin: 1rem 0; }
.content th, .content td { text-align: left; vertical-align: top; padding: .55rem .75rem; border-bottom: 1px solid var(--line); }
.content th { font-family: var(--display); font-weight: 600; font-size: .85rem; }
.content li + li { margin-top: .25rem; }
.content .starlight-aside { background: var(--note-bg); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: .75rem 1rem; margin: 1.25rem 0; }
.content .starlight-aside__title { font: 600 .95rem var(--display); margin: 0 0 .25rem; display: flex; gap: .4rem; align-items: center; }
.content .starlight-aside svg, .content .sl-link-card svg { width: 1.1rem; height: 1.1rem; flex: none; fill: currentColor; }
.content .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: .75rem; margin: 1rem 0; }
.content .sl-link-card { position: relative; display: grid; grid-template-columns: 1fr auto; gap: .25rem; border: 1px solid var(--line); border-radius: 8px; padding: .9rem 1rem; }
.content .sl-link-card a { font-weight: 600; color: var(--ink); text-decoration: none; }
.content .sl-link-card a::before { content: ""; position: absolute; inset: 0; }
.content .sl-link-card:hover { border-color: var(--accent); }
.content .sl-link-card .stack { display: flex; flex-direction: column; gap: .2rem; min-width: 0; }
.content .sl-link-card .description { grid-column: 1; color: var(--muted); font-size: .9rem; }
.live { margin: 2.5rem 0 0; font-size: .8rem; color: var(--muted); }
.live span { font-family: var(--mono); overflow-wrap: anywhere; }
.pager { display: flex; justify-content: space-between; gap: 1rem; margin-top: 1rem; }
.pager button { font: 600 .9rem var(--display); color: var(--accent); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: .6rem 1rem; cursor: pointer; max-width: 48%; text-align: left; }
.pager button:hover { border-color: var(--accent); }
.pager button[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 52rem) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 1rem; }
  nav.menu { position: static; max-height: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: .5rem .75rem; }
  nav.menu summary { display: block; font: 600 .95rem var(--display); cursor: pointer; padding: .35rem 0; }
}
</style>

<div class="shell">
  <header class="top">
    <h2><span class="badge-draft">Review copy</span>{{names}} documentation</h2>
    <p>{{summary}} Leave a comment on anything that needs changing.</p>
  </header>
  <nav class="menu" aria-label="Pages">
    <details id="menu-fold" open><summary>All pages</summary>{{nav}}</details>
  </nav>
  <main>
    {{pages}}
    <div class="pager"><button type="button" id="prev"></button><button type="button" id="next"></button></div>
  </main>
</div>

<script>
(function () {
  var pages = Array.prototype.slice.call(document.querySelectorAll('article.page'));
  var links = Array.prototype.slice.call(document.querySelectorAll('nav.menu a'));
  var prev = document.getElementById('prev'), next = document.getElementById('next');
  var fold = document.getElementById('menu-fold');
  var narrow = window.matchMedia('(max-width: 52rem)');
  function show() {
    var id = location.hash.slice(1);
    var index = pages.findIndex(function (p) { return p.id === id; });
    if (index < 0) index = pages.findIndex(function (p) { return p.id === '{{first}}'; });
    pages.forEach(function (p, i) { p.hidden = i !== index; });
    links.forEach(function (a) { if (a.getAttribute('href') === '#' + pages[index].id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    var before = pages[index - 1], after = pages[index + 1];
    prev.hidden = !before; next.hidden = !after;
    if (before) { prev.textContent = '← ' + before.querySelector('h1').textContent; prev.onclick = function () { location.hash = before.id; }; }
    if (after) { next.textContent = after.querySelector('h1').textContent + ' →'; next.onclick = function () { location.hash = after.id; }; }
    if (narrow.matches && id) fold.open = false;
    setTimeout(function () { window.scrollTo(0, 0); }, 0);
  }
  if (narrow.matches) fold.open = false;
  window.addEventListener('hashchange', show);
  show();
})();
</script>
