<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
  <title id="t">How answers, roles and places connect</title>
  <desc id="d">On the left, the ways someone gets a role: picking an answer when joining or on Your paths, being given a role by staff or an invite, reaching a level, or holding a member tier. In the middle, each role, level and tier has a What holders get list: places for the menu and places to follow. On the right, the member's menu: start-here places, always-shown places, places from what they hold and places they added, minus places they removed or hid. Everything else stays under See all places.</desc>
  <rect width="760" height="420" rx="16" fill="#F5F7FB"/>
  <text x="32" y="40" fill="#14213D" font-size="18" font-weight="700">How answers, roles and places connect</text>

  <text x="32" y="78" fill="#47536B" font-size="13" font-weight="600">HOW SOMEONE GETS IT</text>
  <g font-size="13" fill="#14213D">
    <rect x="24" y="90" width="210" height="52" rx="10" fill="#fff" stroke="#C9D3EA"/>
    <text x="40" y="112" font-weight="600">Picks an answer</text>
    <text x="40" y="130" fill="#47536B" font-size="12">"Where do you play?" › Switch</text>
    <rect x="24" y="152" width="210" height="52" rx="10" fill="#fff" stroke="#C9D3EA"/>
    <text x="40" y="174" font-weight="600">Given by staff or an invite</text>
    <text x="40" y="192" fill="#47536B" font-size="12">Moderator, Raid team</text>
    <rect x="24" y="214" width="210" height="52" rx="10" fill="#fff" stroke="#C9D3EA"/>
    <text x="40" y="236" font-weight="600">Reaches a level</text>
    <text x="40" y="254" fill="#47536B" font-size="12">Level 3 · Regular</text>
    <rect x="24" y="276" width="210" height="52" rx="10" fill="#fff" stroke="#C9D3EA"/>
    <text x="40" y="298" font-weight="600">Holds a member tier</text>
    <text x="40" y="316" fill="#47536B" font-size="12">Supporters</text>
  </g>

  <g stroke="#0C5F86" stroke-width="2" fill="none">
    <path d="M234 116h36"/><path d="M234 178h36"/><path d="M234 240h36"/><path d="M234 302h36"/>
    <path d="M490 208h36"/>
    <path d="M520 202l8 6-8 6"/>
  </g>

  <text x="280" y="78" fill="#47536B" font-size="13" font-weight="600">ROLE, LEVEL OR TIER</text>
  <rect x="270" y="90" width="220" height="238" rx="12" fill="#fff" stroke="#0C5F86" stroke-width="1.5"/>
  <text x="288" y="118" fill="#14213D" font-size="15" font-weight="700">What holders get</text>
  <text x="288" y="150" fill="#14213D" font-size="13" font-weight="600">In their menu</text>
  <rect x="288" y="160" width="86" height="24" rx="12" fill="#E3EEF5"/>
  <text x="331" y="176" fill="#0C5F86" font-size="12" text-anchor="middle">Raid team</text>
  <rect x="380" y="160" width="96" height="24" rx="12" fill="#E3EEF5"/>
  <text x="428" y="176" fill="#0C5F86" font-size="12" text-anchor="middle"># raid-signups</text>
  <text x="288" y="214" fill="#14213D" font-size="13" font-weight="600">Alerts</text>
  <text x="288" y="234" fill="#47536B" font-size="12">New conversations in Raid team</text>
  <text x="288" y="270" fill="#14213D" font-size="13" font-weight="600">Never staff powers</text>
  <text x="288" y="290" fill="#47536B" font-size="12">when members can pick it</text>

  <text x="536" y="78" fill="#47536B" font-size="13" font-weight="600">THEIR MENU</text>
  <rect x="526" y="90" width="210" height="238" rx="12" fill="#fff" stroke="#C9D3EA"/>
  <g font-size="12" fill="#14213D">
    <text x="542" y="118">+ Start-here places</text>
    <text x="542" y="142">+ Always-shown places</text>
    <text x="542" y="166">+ Places from what they hold</text>
    <text x="542" y="190">+ Places they added</text>
    <text x="542" y="214">− Places they removed or hid</text>
  </g>
  <line x1="542" y1="232" x2="720" y2="232" stroke="#C9D3EA"/>
  <text x="542" y="258" fill="#14213D" font-size="13" font-weight="600">See all places</text>
  <text x="542" y="278" fill="#47536B" font-size="12">Everything else they can open,</text>
  <text x="542" y="296" fill="#47536B" font-size="12">one tap away</text>

  <text x="32" y="372" fill="#47536B" font-size="12">Picking a path never opens anything a member couldn't open, except a members-only place the owner opened to that role.</text>
  <text x="32" y="392" fill="#47536B" font-size="12">Paths, menus and hidden places are private to each member. Staff see rounded totals only.</text>
</svg>
